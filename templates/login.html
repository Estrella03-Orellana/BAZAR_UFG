<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Bazar B.E.G.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}" />
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">
      <h2>Bazar <span>B.E.G.</span></h2>
      <p>Brilla · Encanta · Gobierna</p>
    </div>

    <p class="login-subtitle">Iniciar Sesión</p>
    <p class="login-sub">Accede a tu cuenta para gestionar los catálogos.</p>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('login_bp.login') }}" method="POST">
      <label for="email">Correo electrónico</label>
      <input type="text" id="email" name="email"
             placeholder="ejemplo@correo.com" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password"
             placeholder="••••••••" required />

      <button type="submit">Iniciar Sesión</button>
    </form>

    <p class="form-link">
      ¿No tienes una cuenta? <a href="{{ url_for('login_bp.register') }}">Regístrate aquí</a>
    </p>
  </div>

</body>
</html>
