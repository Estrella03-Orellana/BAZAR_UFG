<div class="toast" id="beg-toast">
  <div class="toast-icon" id="beg-toast-icon">✅</div>
  <div>
    <p class="toast-title" id="beg-toast-title"></p>
    <p class="toast-msg" id="beg-toast-msg"></p>
  </div>
</div>

<script>
  function begShowToast(title, msg, isRemove) {
    const t = document.getElementById('beg-toast');
    document.getElementById('beg-toast-title').textContent = title;
    document.getElementById('beg-toast-msg').textContent = msg;
    document.getElementById('beg-toast-icon').textContent = isRemove ? '🗑️' : '✅';
    if (isRemove) t.classList.add('toast-remove');
    else t.classList.remove('toast-remove');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  window.addEventListener('DOMContentLoaded', function() {
    {% for msg in messages %}
    {% if msg == 'added' %}
    begShowToast('¡Producto agregado!', 'Tu producto se ha añadido al carrito.', false);
    {% elif msg == 'removed' %}
    begShowToast('¡Producto eliminado!', 'El producto se ha eliminado del carrito.', true);
    {% endif %}
    {% endfor %}
  });
  {% endif %}
  {% endwith %}
</script>
