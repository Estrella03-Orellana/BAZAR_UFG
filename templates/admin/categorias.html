<h1>CRUD Categorías</h1>

<a href="/categorias/crear"> Crear Categoría </a>

<br /><br />

<table border="1" cellpadding="10">
  <tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Acciones</th>
  </tr>

  {% for categoria in categorias %}

  <tr>
    <td>{{ categoria['id'] }}</td>

    <td>{{ categoria['nombre'] }}</td>

    <td>
      <a href="/categorias/editar/{{ categoria['id'] }}"> Editar </a>

      |

      <a href="/categorias/eliminar/{{ categoria['id'] }}"> Eliminar </a>
    </td>
  </tr>

  {% endfor %}
</table>

<br />

<a href="/"> Volver al inicio </a>
