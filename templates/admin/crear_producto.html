<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Producto — Admin</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/estilos.css') }}"
    />
  </head>
  <body>
    {% include 'admin/_navbar.html' %}

    <main class="page admin-page">
      <h1>Crear Producto</h1>

      <form
        method="POST"
        action="/productos/crear"
        enctype="multipart/form-data"
      >
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="precio">Precio:</label>
        <input type="number" id="precio" step="0.01" name="precio" required />

        <label for="categoria_id">Categoría:</label>
        <select id="categoria_id" name="categoria_id">
          {% for categoria in categorias %}
          <option value="{{ categoria['id'] }}">
            {{ categoria['nombre'] }}
          </option>
          {% endfor %}
        </select>

        <label for="imagen">Imagen:</label>
        <input
          type="file"
          id="imagen"
          name="imagen"
          accept="image/*"
          required
          onchange="mostrarPreview(event)"
        />

        <br /><br />

        <img
          id="preview"
          src="#"
          alt="Vista previa"
          style="
            display: none;
            max-width: 200px;
            border-radius: 10px;
            border: 1px solid #ccc;
          "
        />

        <br /><br />

        <button type="submit">Guardar</button>
      </form>

      <br />

      <a href="/productos" class="accion-volver"> ← Volver </a>
    </main>

    <script>
      function mostrarPreview(event) {
        const preview = document.getElementById("preview");

        preview.src = URL.createObjectURL(event.target.files[0]);

        preview.style.display = "block";
      }
    </script>
  </body>
</html>
