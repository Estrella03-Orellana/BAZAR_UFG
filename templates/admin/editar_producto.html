<h1>Editar Producto</h1>

<form method="POST">

    <label>Nombre:</label>

    <br>

    <input
        type="text"
        name="nombre"
        value="{{ producto['nombre'] }}"
        required
    >

    <br><br>

    <label>Precio:</label>

    <br>

    <input
        type="number"
        step="0.01"
        name="precio"
        value="{{ producto['precio'] }}"
        required
    >

    <br><br>

    <label>Categoría:</label>

    <br>

    <select name="categoria_id">

        {% for categoria in categorias %}

        <option
            value="{{ categoria['id'] }}"

            {% if categoria['id'] == producto['categoria_id'] %}
                selected
            {% endif %}
        >

            {{ categoria['nombre'] }}

        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">
        Actualizar
    </button>

</form>

<br>

<a href="/productos">
    Volver
</a>
